name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the GitHub release
      pull-requests: write # open and update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Chained here on purpose: a tag created with GITHUB_TOKEN never triggers
  # another workflow, so a standalone on:push tags workflow would not fire.
  build:
    name: Build plugin jar
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew check shadowJar

      - name: Upload plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: plugin-jar
          path: plugin/build/libs/corvus-velocity-*.jar
          if-no-files-found: error
          retention-days: 14

  # Scans the shaded jar that actually ships (rootfs sees bundled libraries, fs does not).
  security-gate:
    name: Security gate
    needs: build
    permissions:
      contents: read
      security-events: write
    uses: OneLiteFeatherNET/workflows/.github/workflows/security-scan.yml@v2.9.0
    with:
      scan-type: rootfs
      artifact-name: plugin-jar
      severity: "CRITICAL,HIGH"
      fail-on-findings: false
    secrets: inherit

  publish:
    name: Attach jar to GitHub release
    needs: [release-please, build, security-gate]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload assets to the release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: plugin-jar
          path: dist

      - name: Upload jar to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" dist/corvus-velocity-*.jar --clobber

  # Separate job: Dependency-Track being down must never take the release with it.
  sbom:
    name: Publish SBOM
    needs: [release-please, publish]
    uses: OneLiteFeatherNET/workflows/.github/workflows/sbom-publish.yml@v2.9.0
    with:
      project-name: "Corvus"
      project-version: ${{ needs.release-please.outputs.version }}
      project-tags: "velocity,plugin,ml"
    secrets: inherit
