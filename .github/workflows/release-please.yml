name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the GitHub release
      pull-requests: write # open and update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Chained here on purpose: a tag created with GITHUB_TOKEN never triggers
  # another workflow, so a standalone on:push tags workflow would not fire.
  build:
    name: Build plugin jar
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew check shadowJar

      - name: Upload plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: plugin-jar
          path: plugin/build/libs/corvus-velocity-*.jar
          if-no-files-found: error
          retention-days: 14

  # Container images. The reusable workflow signs keyless with cosign and pushes to the OLF Harbor
  # registry (HARBOR_* secrets). It tags the image with the release version (semver tags plus the
  # commit sha) and builds linux/amd64 only. The chart pins its image tag to the same version.
  images-detect:
    name: Detect image sources
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ml: ${{ steps.detect.outputs.ml }}
      ui: ${{ steps.detect.outputs.ui }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      # The UI and ML job images only exist once their Dockerfiles do; until then the job is skipped.
      - id: detect
        run: |
          if [ -f ui/Dockerfile ]; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ui/Dockerfile not found, skipping the ui image"
          fi
          if [ -f ml/Dockerfile ]; then
            echo "ml=true" >> "$GITHUB_OUTPUT"
          else
            echo "ml=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ml/Dockerfile not found, skipping the ml image"
          fi

  image-services:
    name: Publish corvus-services image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      id-token: write # keyless cosign signing
    uses: OneLiteFeatherNET/workflows/.github/workflows/docker-publish.yml@v2.9.1
    with:
      image-name: "onelitefeather/corvus-services"
      version: ${{ needs.release-please.outputs.version }}
      # The Dockerfile copies proto/ and services/ paths, so the context is the repository root.
      context: "."
      dockerfile: "services/Dockerfile"
    secrets: inherit

  image-ml:
    name: Publish corvus-ml image
    needs: [release-please, images-detect]
    if: needs.release-please.outputs.release_created == 'true' && needs.images-detect.outputs.ml == 'true'
    permissions:
      contents: read
      id-token: write # keyless cosign signing
    uses: OneLiteFeatherNET/workflows/.github/workflows/docker-publish.yml@v2.9.1
    with:
      image-name: "onelitefeather/corvus-ml"
      version: ${{ needs.release-please.outputs.version }}
      # The Dockerfile copies proto/ and ml/ paths, so the context is the repository root.
      context: "."
      dockerfile: "ml/Dockerfile"
    secrets: inherit

  image-ui:
    name: Publish corvus-ui image
    needs: [release-please, images-detect]
    if: needs.release-please.outputs.release_created == 'true' && needs.images-detect.outputs.ui == 'true'
    permissions:
      contents: read
      id-token: write # keyless cosign signing
    uses: OneLiteFeatherNET/workflows/.github/workflows/docker-publish.yml@v2.9.1
    with:
      image-name: "onelitefeather/corvus-ui"
      version: ${{ needs.release-please.outputs.version }}
      context: "."
      dockerfile: "ui/Dockerfile"
    secrets: inherit

  # Scans the shaded jar that actually ships (rootfs sees bundled libraries, fs does not).
  security-gate:
    name: Security gate
    needs: build
    permissions:
      contents: read
      security-events: write
    uses: OneLiteFeatherNET/workflows/.github/workflows/security-scan.yml@v2.9.1
    with:
      scan-type: rootfs
      artifact-name: plugin-jar
      severity: "CRITICAL,HIGH"
      fail-on-findings: false
    secrets: inherit

  publish:
    name: Attach jar to GitHub release
    needs: [release-please, build, security-gate]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload assets to the release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: plugin-jar
          path: dist

      - name: Upload jar to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" dist/corvus-velocity-*.jar --clobber

  # Separate job: Dependency-Track being down must never take the release with it.
  sbom:
    name: Publish SBOM
    needs: [release-please, publish]
    uses: OneLiteFeatherNET/workflows/.github/workflows/sbom-publish.yml@v2.9.1
    with:
      project-name: "Corvus"
      project-version: ${{ needs.release-please.outputs.version }}
      project-tags: "velocity,plugin,ml"
    secrets: inherit
