# Corvus plugin configuration for the pilot. Mounted read-only as plugins/corvus/config.toml.
# Key names follow CorvusConfig.DEFAULT_TOML of the plugin (CorvusConfigTest guards this file).
# Captures are written to plugins/corvus/captures (mounted from deploy/pilot/data/captures).

proxy_id = "pilot-proxy"

[pseudonym]
# The base64 HMAC key comes from the CORVUS_PSEUDONYM_KEY environment variable (set in .env).
# Without it the plugin loads but captures nothing.
key_file = ""
key_id = "pilot-1"

[players]
mode = "all"
allowlist = []
blocklist = []

[capture]
# Privacy: "serverbound" records payload bytes of serverbound play packets (minus text-bearing types
# such as signs, books, anvil names, plugin messages) and of a few clientbound motion packets.
# Clientbound payloads would contain names and UUIDs of other players and are not kept.
# Use "none" to record no payload bytes at all. "all" is for local debugging only.
raw_payloads = "serverbound"
max_payload_bytes = 2048
queue_max_bytes = 67108864
batch_size = 200
flush_interval_seconds = 5

[sink]
# "file" (pilot): captures are written to plugins/corvus/captures.
# "nats": publish every envelope to NATS JetStream instead (contract: docs/reference/data-lake.md, section 1).
# The stream CORVUS_CAPTURE (subjects corvus.capture.v1.>) must already exist; the plugin never creates it.
# To switch, set type = "nats" and add a [nats] table with these keys (all optional):
#   [nats]
#   url = ["nats://nats.example:4222"]      # required for type = "nats": one URL or a list
#   creds_file = "/path/to/corvus.creds"    # empty = no authentication
#   subject_prefix = "corvus.capture.v1"    # published to <subject_prefix>.<proxy_id>.<partition>
#   partitions = 16                         # partition = first 4 bytes of session id (big-endian) mod this,
#                                           # two digits (00..15); identical on all proxies and the scorers
#   max_in_flight_bytes = 33554432          # unacknowledged bytes; beyond this batches are dropped
#   publish_timeout_seconds = 5             # no ack after this long = failed, counted as dropped_transport
#   reconnect_buffer_bytes = 8388608        # bytes buffered while reconnecting
type = "file"

[scores]
# Online scores for other plugins (corvus-api, docs/reference/plugin-api.md). Off here because the pilot uses the
# file sink. With sink.type = "nats" this defaults to on and subscribes to corvus.score.v1.> (core NATS, needs the
# [nats] url and the pseudonym key). To enable it without the nats sink, uncomment:
#   enabled = true
# Scores are decision aids; only ENFORCE scores are meant for automated actions, Corvus never sanctions players.
subject = "corvus.score.v1.>"
listener_threads = 2
listener_queue = 1024

[blocklist_sync]
# Periodically fetch the blocklist of the control plane (GET <url>/api/v1/plugin/blocklist, proxy API token from
# CORVUS_API_PLUGIN_TOKENS) and never capture the listed pseudonyms; players blocked while online lose their
# session. The token is read from CORVUS_PLUGIN_API_TOKEN or token_file (relative to plugins/corvus). A failed
# sync keeps the last good list. Off in the pilot, which runs without the control plane.
enabled = false
url = ""
token_file = ""
interval_seconds = 300
timeout_seconds = 10

[tls]
# Extra PEM CA bundle (e.g. a private step-ca) trusted in addition to the JVM default CAs for NATS (tls://, wss://)
# and blocklist_sync (https://); relative to plugins/corvus or absolute. Empty = JVM default only. The pilot does
# not need it. An unreadable file stops the NATS sink, scores and blocklist sync (ERROR in the log).
ca_file = ""

[game_context]
default = "unknown"

# backend server name (see velocity.toml) = game context tag
[game_context.servers]
lobby = "lobby"
pvp = "pvp"
