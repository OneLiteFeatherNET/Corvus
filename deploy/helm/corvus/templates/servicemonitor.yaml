{{- if .Values.serviceMonitor.enabled }}
{{- range $component := list "ingest" "score" "api" }}
{{- if (index $.Values $component).enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "corvus.fullname" $ }}-{{ $component }}
  labels:
    {{- include "corvus.componentLabels" (dict "root" $ "component" $component) | nindent 4 }}
    {{- with $.Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "corvus.componentSelectorLabels" (dict "root" $ "component" $component) | nindent 6 }}
  endpoints:
    - port: {{ if eq $component "api" }}http{{ else }}metrics{{ end }}
      path: /metrics
      interval: {{ $.Values.serviceMonitor.interval }}
{{- end }}
{{- end }}
{{- end }}
