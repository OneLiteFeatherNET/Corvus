{{- if .Values.ui.enabled }}
{{- $config := include "corvus.uiConfig" . }}
{{- $upstream := include "corvus.uiApiUpstream" . }}
{{- $apiOrigin := default (include "corvus.origin" .Values.ui.config.apiBaseUrl) .Values.ui.apiOrigin }}
{{- $oidcOrigin := default (include "corvus.origin" .Values.ui.config.oidc.issuer) .Values.ui.oidcOrigin }}
{{- /* The nginx-unprivileged image runs as uid 101: its podSecurityContext wins over the global one. */}}
{{- $podCtx := dict "Values" (dict "podSecurityContext" (merge (deepCopy .Values.ui.podSecurityContext) (deepCopy .Values.podSecurityContext)) "imagePullSecrets" .Values.imagePullSecrets "nodeSelector" .Values.nodeSelector "tolerations" .Values.tolerations "affinity" .Values.affinity "topologySpreadConstraints" .Values.topologySpreadConstraints) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "corvus.fullname" . }}-ui
  labels:
    {{- include "corvus.componentLabels" (dict "root" . "component" "ui") | nindent 4 }}
data:
  config.json: |
    {{- $config | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "corvus.fullname" . }}-ui
  labels:
    {{- include "corvus.componentLabels" (dict "root" . "component" "ui") | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      {{- include "corvus.componentSelectorLabels" (dict "root" . "component" "ui") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "corvus.podLabels" (dict "root" . "component" "ui") | nindent 8 }}
      annotations:
        checksum/config: {{ $config | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "corvus.serviceAccountName" (dict "root" . "component" "ui") }}
      automountServiceAccountToken: false
      {{- include "corvus.podCommon" $podCtx | nindent 6 }}
      containers:
        - name: ui
          image: {{ include "corvus.uiImage" . }}
          imagePullPolicy: {{ .Values.uiImage.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: CORVUS_UI_BASE_PATH
              value: {{ .Values.ui.basePath | quote }}
            {{- with $upstream }}
            - name: CORVUS_UI_API_UPSTREAM
              value: {{ . | quote }}
            {{- end }}
            {{- with $apiOrigin }}
            - name: CORVUS_UI_API_ORIGIN
              value: {{ . | quote }}
            {{- end }}
            {{- with $oidcOrigin }}
            - name: CORVUS_UI_OIDC_ORIGIN
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.ui.extraConnect }}
            - name: CORVUS_UI_EXTRA_CONNECT
              value: {{ join " " . | quote }}
            {{- end }}
          ports:
            - name: http
              # Fixed by ui/docker/default.conf.template.
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
              readOnly: true
            {{- include "corvus.tmpMount" . | nindent 12 }}
            - name: nginx-cache
              mountPath: /var/cache/nginx
            # The entrypoint renders the server block from the template into this directory.
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: config
          configMap:
            name: {{ include "corvus.fullname" . }}-ui
        {{- include "corvus.tmpVolume" . | nindent 8 }}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-conf
          emptyDir:
            sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "corvus.fullname" . }}-ui
  labels:
    {{- include "corvus.componentLabels" (dict "root" . "component" "ui") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "corvus.componentSelectorLabels" (dict "root" . "component" "ui") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ui.port }}
      targetPort: http
      protocol: TCP
{{- if .Values.ui.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "corvus.fullname" . }}-ui
  labels:
    {{- include "corvus.componentLabels" (dict "root" . "component" "ui") | nindent 4 }}
  {{- with .Values.ui.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- include "corvus.ingressSpec" (dict "cfg" .Values.ui.ingress "svc" (printf "%s-ui" (include "corvus.fullname" .)) "port" .Values.ui.port) | nindent 2 }}
{{- end }}
{{- if .Values.ui.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "corvus.fullname" . }}-ui
  labels:
    {{- include "corvus.componentLabels" (dict "root" . "component" "ui") | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.ui.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "corvus.componentSelectorLabels" (dict "root" . "component" "ui") | nindent 6 }}
{{- end }}
{{- end }}
