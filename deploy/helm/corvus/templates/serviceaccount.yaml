{{- if .Values.serviceAccount.create }}
{{- range $component := list "ingest" "api" "score" "housekeeping" "compact" "ui" }}
{{- if (index $.Values $component).enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "corvus.serviceAccountName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "corvus.componentLabels" (dict "root" $ "component" $component) | nindent 4 }}
  {{- with $.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No component talks to the Kubernetes API except the api with the kubernetes job runner, which
# opts in on its pod spec.
automountServiceAccountToken: false
{{- end }}
{{- end }}
{{- end }}
