# Corvus chart values. No secret value belongs in this file: credentials are read from existing
# Secrets that are referenced by name (see docs/how-to/deploy-with-helm.md for the full list).
# NATS JetStream, PostgreSQL and the S3 bucket are external dependencies and are not deployed here.

nameOverride: ""
fullnameOverride: ""

# Image of the Python services (ingest, api, score, housekeeping, migrate). The tag defaults to the
# chart's appVersion, which release-please keeps in lockstep with the published image.
image:
  repository: harbor.onelitefeather.dev/onelitefeather/corvus-services
  tag: ""
  pullPolicy: IfNotPresent

# Image of the management UI (static nginx). Same version scheme as the services image.
uiImage:
  repository: harbor.onelitefeather.dev/onelitefeather/corvus-ui
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Labels / annotations added to every pod (for example a log-routing label).
podLabels: {}
podAnnotations: {}

# Hardened defaults for every workload. The root filesystem is read-only; /tmp and the cache dirs
# are emptyDir volumes.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Size limit of the per-pod /tmp emptyDir (parquet staging and caches).
tmpSizeLimit: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# ---- external dependencies ---------------------------------------------------------------------

nats:
  url: nats://nats.nats.svc:4222
  stream: CORVUS_CAPTURE
  # Optional Secret with a NATS credentials file (.creds), mounted read-only into ingest and score
  # and passed as CORVUS_NATS_CREDS_FILE. Needs a services image with that setting.
  credsSecret: ""
  credsKey: nats.creds

database:
  # Secret holding the full libpq DSN (including user and password). With CloudNativePG use the
  # app secret and its `uri` key.
  existingSecret: corvus-database
  dsnKey: uri
  # Alternative: separate libpq settings. When `host` is set, dsnKey is ignored; the password (and
  # optionally the user, userKey) is read from existingSecret and handed to psycopg via PGPASSWORD
  # (PGUSER). With CloudNativePG: host <cluster>-rw, name app, userKey username, passwordKey password.
  host: ""
  port: 5432
  name: ""
  user: ""
  userKey: ""
  passwordKey: ""

s3:
  endpointUrl: ""
  bucket: corvus-lake
  region: us-east-1
  # Secret with the object store credentials. For a Rook-Ceph ObjectBucketClaim the keys are
  # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY.
  existingSecret: corvus-s3
  accessKeyKey: access-key
  secretKeyKey: secret-key
  # Optional: read bucket and endpoint from the ConfigMap an ObjectBucketClaim creates (BUCKET_NAME,
  # BUCKET_HOST, BUCKET_PORT) instead of `bucket` and `endpointUrl`.
  bucketConfigMap:
    name: ""
    bucketKey: BUCKET_NAME
    hostKey: BUCKET_HOST
    portKey: BUCKET_PORT
    scheme: http

# Key encryption key (base64, 32 bytes) wrapping every player data key. Losing it makes all raw
# payloads unreadable. Needed by ingest only.
kek:
  existingSecret: corvus-kek
  key: kek
  id: kek-1

# Pseudonym key, identical to the one the proxies use (base64, at least 16 bytes). Needed by the
# api only; without it lookup and erasure by UUID answer 503.
pseudonym:
  enabled: true
  existingSecret: corvus-pseudonym
  key: key
  keyId: k1

# ---- components --------------------------------------------------------------------------------

# One-shot schema migration, run as a Helm pre-install/pre-upgrade hook.
migrate:
  enabled: true
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}

ingest:
  enabled: true
  replicas: 2
  # CORVUS_WORKERS; empty lets the service derive it from the CPU limit.
  workers: ""
  metricsPort: 9464
  # Additional CORVUS_* settings as plain values.
  env: {}
  resources:
    requests: {cpu: "1", memory: 512Mi}
    limits: {cpu: "4", memory: 1Gi}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  terminationGracePeriodSeconds: 120

api:
  enabled: true
  replicas: 2
  port: 8080
  env: {}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  oidc:
    issuer: ""
    audience: ""
    jwksUrl: ""
    rolesClaim: roles
    # JSON object mapping external role names to admin/data_scientist/staff/viewer.
    roleMapping: ""
  # Optional Secret with CORVUS_API_PLUGIN_TOKENS (comma separated proxy tokens) and further
  # CORVUS_API_* credentials. Every key of the Secret becomes an environment variable.
  extraSecret: ""
  # Browser origins allowed by CORS (CORVUS_API_CORS_ORIGINS). Leave empty when the UI proxies /api/
  # on its own origin (ui.proxyApi); set it when the UI calls the API on another origin.
  cors:
    origins: []
  # Machine tokens of ML jobs (CORVUS_API_JOB_TOKENS: comma separated "<sha256 hex of token>:<job
  # name>"). Only hashes are configured; the plain token goes to the job pods, see api.jobs.envSecret.
  jobTokens:
    existingSecret: ""
    key: job-tokens
  # Training / evaluation jobs started by the API.
  jobs:
    # kubernetes: the API creates batch/v1 Jobs in its own namespace (RBAC is created).
    # local: subprocesses inside the API pod (single-host setups only).
    runner: kubernetes
    image:
      repository: harbor.onelitefeather.dev/onelitefeather/corvus-ml
      tag: ""
    serviceAccount: ""
    # Secret exposed as environment to the job pods: S3/DB credentials plus CORVUS_API_URL (for example
    # http://<release>-corvus-api:8080) and CORVUS_API_TOKEN, the plain token whose SHA-256 is listed
    # in api.jobTokens.
    envSecret: ""
    cpuRequest: "1"
    cpuLimit: "4"
    memoryRequest: 2Gi
    memoryLimit: 8Gi
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: corvus-api.example.invalid
        paths:
          - path: /
            pathType: Prefix
    tls: []

# Online scoring. A StatefulSet: replica i of n owns the partitions p with p mod n == i, so the
# pod ordinal is the replica index and CORVUS_SCORE_REPLICAS must equal the replica count. Scale by
# changing `score.replicas` only (never with kubectl scale or an HPA); the value feeds both.
score:
  enabled: true
  replicas: 2
  metricsPort: 9464
  env: {}
  resources:
    requests: {cpu: "1", memory: 512Mi}
    limits: {cpu: "4", memory: 1Gi}
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  terminationGracePeriodSeconds: 60

# Retention cleanup (raw payloads, orphans, staging, batch log).
housekeeping:
  enabled: true
  schedule: "17 3 * * *"
  startingDeadlineSeconds: 600
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  backoffLimit: 1
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  env: {}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}

ui:
  enabled: false
  replicas: 2
  # Port of the Service. The container always listens on 8080 (nginx-unprivileged image).
  port: 8080
  # CORVUS_UI_BASE_PATH and config.basePath: the path the UI is served under. Set it when the ingress
  # publishes the UI under a prefix and forwards the path unchanged, for example /corvus/.
  basePath: /
  # nginx proxies /api/ to the in-cluster api Service on the UI's own origin, so no CORS is needed
  # (apiBaseUrl is then the path /api/v1). Set apiUpstream to proxy to another upstream instead.
  proxyApi: true
  apiUpstream: ""
  # Origins added to the CSP connect-src. By default they are derived: the origin of an absolute
  # config.apiBaseUrl and of config.oidc.issuer. Set these when the derived value is not right (for
  # example when the token endpoint is on another host).
  apiOrigin: ""
  oidcOrigin: ""
  extraConnect: []
  # Rendered as /usr/share/nginx/html/config.json (runtime configuration of the SPA, see
  # docs/how-to/run-the-ui.md). basePath is taken from ui.basePath.
  config:
    # Control-plane API root: an absolute path behind the proxy, or an absolute URL (needs api.cors).
    apiBaseUrl: /api/v1
    auth:
      # oidc: Authorization Code with PKCE. token: paste a bearer token (development only).
      mode: oidc
      rolesClaim: roles
      roleMapping: {}
    oidc:
      issuer: ""
      clientId: ""
      scopes: openid profile
  # The nginx-unprivileged image runs as uid 101; this overrides the global podSecurityContext.
  podSecurityContext:
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 128Mi}
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: corvus.example.invalid
        paths:
          - path: /
            pathType: Prefix
    tls: []

# ---- cross-cutting -----------------------------------------------------------------------------

serviceAccount:
  # One ServiceAccount per component (ingest, api, score, housekeeping, ui) named
  # <fullname>-<component>; none of them mounts a token except the api with the kubernetes runner.
  create: true
  annotations: {}

networkPolicy:
  enabled: false
  # Namespace labels allowed to scrape metrics (empty: any pod in the same namespace).
  metricsNamespaceSelector: {}
  # Peers allowed to reach the api / ui (empty: from anywhere, as an ingress controller needs).
  apiFrom: []
  uiFrom: []
  # Egress ports to external dependencies: NATS, PostgreSQL, HTTP(S) for S3/OIDC/Kubernetes API.
  egressPorts: [4222, 5432, 80, 443, 6443, 9000]

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}
