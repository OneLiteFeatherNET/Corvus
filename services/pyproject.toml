[project]
name = "corvus-services"
version = "0.1.0"
description = "Corvus backend services: capture ingest, catalog migrations, lake housekeeping"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "nats-py>=2.16",
    "pyarrow>=26.0",
    "boto3>=1.43",
    "psycopg[binary,pool]>=3.3",
    "cryptography>=50.0",
    "prometheus-client>=0.26",
    "pydantic-settings>=2.16",
    "protobuf>=6.31",
]

[project.scripts]
corvus-ingest = "corvus_services.ingest:main"
corvus-migrate = "corvus_services.migrate:main"
corvus-housekeeping = "corvus_services.housekeeping:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.12",
    "mypy>=1.15",
    "boto3-stubs[s3]>=1.43",
]
# protoc for scripts/gen_proto.sh (build time only, not shipped in the image)
proto = [
    "grpcio-tools>=1.74",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corvus_services"]
artifacts = ["src/corvus_services/_gen/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers -m 'not integration'"
asyncio_mode = "auto"
markers = [
    "integration: needs real NATS, MinIO and PostgreSQL (dev compose stack); skipped by default",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["src/corvus_services/_gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PT"]

[tool.mypy]
python_version = "3.13"
strict = true
exclude = ["src/corvus_services/_gen"]

[[tool.mypy.overrides]]
module = ["nats.*", "pyarrow.*", "psycopg_pool.*", "google.protobuf.*"]
ignore_missing_imports = true
follow_imports = "skip"
