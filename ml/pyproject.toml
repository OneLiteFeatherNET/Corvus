[project]
name = "corvus-ml"
version = "0.1.0"
description = "Corvus ML tooling: pilot capture analyzer"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "protobuf>=6.31",
    # Provides protoc for generating the capture bindings from ../proto.
    "grpcio-tools>=1.74",
    "pyarrow>=26.0.0",
    "numpy>=2.5.4",
]

[project.scripts]
corvus-pilot = "corvus_ml.pilot:main"
corvus-features = "corvus_ml.features.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corvus_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["src/corvus_ml/_gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PT"]
